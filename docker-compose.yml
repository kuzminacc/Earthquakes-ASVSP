version: "3"

services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    ports:
      - 9870:9870
      - 9000:9000
    volumes:
      - ./data:/data
      - hadoop_namenode:/hadoop/dfs/name
      - ./testing:/testing
    environment:
      - CLUSTER_NAME=asvsp
    env_file:
      - ./config.env

  datanode1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode1
    volumes:
      - hadoop_datanode1:/hadoop/dfs/data
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
    env_file:
      - ./config.env

  datanode2:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode2
    volumes:
      - hadoop_datanode2:/hadoop/dfs/data
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
    env_file:
      - ./config.env

  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark-master
    container_name: spark-master
    user: root
    ports:
      - 8000:8080
      - 7077:7077
    environment: 
      - PYSPARK_PYTHON=python3
    env_file:
      - ./config.env
    volumes:
      - ./batch:/batch
      - ./consumer:/consumer
      - ./producer:/produce
      - ./model:/model
      - ./models:/models
      - ./prediction:/prediction


  spark-worker-1:
    build:
      context: .
      dockerfile: Dockerfile.spark-worker 
    container_name: spark-worker-1
    user: root
    depends_on:
      - spark-master
    environment:
      - SPARK_MASTER=spark://spark-master:7077
    ports:
      - 8001:8081
    env_file:
      - ./config.env
    volumes:
      - ./models:/models
  
  spark-worker-2:
    build:
      context: .
      dockerfile: Dockerfile.spark-worker
    container_name: spark-worker-2
    user: root
    depends_on:
      - spark-master
    environment:
      - SPARK_MASTER=spark://spark-master:7077
    ports:
      - 8002:8081
    env_file:
      - ./config.env
    volumes:
      - ./models:/models

  hive-metastore-postgresql:
    image: bde2020/hive-metastore-postgresql:2.3.0
    container_name: hive-metastore-postgresql
    
  hive-metastore:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-metastore
    env_file:
      - ./config.env
    command: /opt/hive/bin/hive --service metastore
    environment:
      SERVICE_PRECONDITION: "namenode:9870 datanode1:9864 datanode2:9864 hive-metastore-postgresql:5432"
    ports:
      - "9083:9083"

  hive-server:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-server
    env_file:
      - ./config.env
    environment:
      HIVE_CORE_CONF_javax_jdo_option_ConnectionURL: "jdbc:postgresql://hive-metastore/metastore"
      SERVICE_PRECONDITION: "hive-metastore:9083"
    ports:
      - "10000:10000"
      
  hue:
    # image: gethue/hue:latest
    build: .
    container_name: hue
    hostname: hue
    dns: 8.8.8.8
    ports:
      - "8888:8888"
    # bind mount config (not working on all OS problems with permission)
    #volumes:
      #- ./hue_config:/usr/share/hue/desktop/conf
    depends_on:
      - namenode

  db:
    image: postgres
    restart: always
    container_name: postgres
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
    ports:
      - 5432:5432
    volumes:
      - db-data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: kuzminacn@gmail.com
      PGADMIN_DEFAULT_PASSWORD: password

  metabase:
    volumes:
      - metabase-data:/metabase-data
    environment:
      - MB_DB_FILE=/metabase-data/metabase.db
      - MB_DB_TYPE=postgres
      - MB_DB_DBNAME=postgres
      - MB_DB_PORT=5432
      - MB_DB_USER=postgres
      - MB_DB_PASS=postgres
      - MB_DB_HOST=db
      - PGDATA= /var/lib/postgresql/data/init/
    ports:
        - 3000:3000
    image: metabase/metabase
    restart: always
    depends_on: 
      - db

  zoo1:
    image: zookeeper:3.4.9
    container_name: zoo1
    ports:
      - "2181:2181"
    environment:
        ZOO_MY_ID: 1
        ZOO_PORT: 2181
        ZOO_SERVERS: server.1=zoo1:2888:3888
    volumes:
      - zoo1:/data
      - zoo1log:/datalo

  kafka1:
    image: confluentinc/cp-kafka:4.1.3-1
    container_name: kafka1
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: LISTENER_DOCKER_INTERNAL://kafka1:19092,LISTENER_DOCKER_EXTERNAL://${DOCKER_HOST_IP:-127.0.0.1}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: LISTENER_DOCKER_INTERNAL:PLAINTEXT,LISTENER_DOCKER_EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: LISTENER_DOCKER_INTERNAL
      KAFKA_ZOOKEEPER_CONNECT: "zoo1:2181"
      KAFKA_BROKER_ID: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG4J_LOGGERS: "kafka.controller=INFO,kafka.producer.async.DefaultEventHandler=INFO,state.change.logger=INFO" #OVO PROVERI
    volumes:
      - kafka1:/var/lib/kafka/data
    depends_on:
      - zoo1
  #ovde mozda dodati jos neke vrednosti
  producer:
    build: ./producer
    container_name: kafka_producer
    environment:
      KAFKA_BROKER: "kafka1:19092"
      KAFKA_TOPIC: "earthquakes-topic"
      DATASET_API_LINK: "https://earthquake.usgs.gov/fdsnws/"
    depends_on:
      - kafka1
    env_file:
      - ./config.env

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"  # Standardni port za MongoDB
    volumes:
      - mongodb-data:/data/db  # Čuvanje podataka na lokalnom disku
    environment:
      TZ: "Europe/Belgrade"
      
  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: always
    ports:
      - "8081:8081"  # Port za pristup Mongo Express UI
    environment:
      ME_CONFIG_MONGODB_URL: "mongodb://mongodb:27017"  # Veza sa MongoDB
      ME_CONFIG_BASICAUTH_USERNAME: "admin"  # Korisničko ime za UI
      ME_CONFIG_BASICAUTH_PASSWORD: "admin"  # Lozinka za UI
    depends_on:
      - mongodb
      
volumes:
  hadoop_namenode:
  hadoop_datanode1:
  hadoop_datanode2:
  db-data:
  metabase-data:
  zoo1:
  zoo1log:
  kafka1:
  mongodb-data:

networks:
  asvsp:
    external: true